name: Build Meelano Legal Luxury APK

on:
  push:
    branches: [ "arena/01a095aa-meelano-legal" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create files and fix duplicates
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo '{"project_info":{"project_number":"000","project_id":"meelano-legal-luxury","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000:android:000","android_client_info":{"package_name":"com.aistudio.meelanolegal.law"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore app/debug.keystore || true
          # Fix duplicate resources: remove webp if both png and webp exist
          echo "Checking for duplicate launcher icons..."
          find app/src/main/res -name "*.webp" -type f | while read f; do
            png="${f%.webp}.png"
            if [ -f "$png" ]; then
              echo "Removing duplicate webp $f (png exists $png)"
              rm -f "$f"
            fi
          done
          echo "Remaining launcher files:"
          find app/src/main/res -name "ic_launcher*" | sort

      - name: Build Debug APK with full error capture
        id: build
        run: |
          set -o pipefail
          echo "Starting build..."
          gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" | tee -a build.log
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          echo "=== APK Search ===" | tee -a build.log
          find . -name "*.apk" -type f 2>/dev/null | tee -a build.log || true
          ls -R app/build/outputs/ 2>/dev/null | head -n 300 | tee -a build.log || true
          
          # Create detailed error file - always
          {
            echo "=== BUILD LOG SUMMARY ==="
            echo "EXIT_CODE=$EXIT_CODE"
            echo "RUN_ID=${{ github.run_id }}"
            echo "SHA=${{ github.sha }}"
            echo ""
            echo "=== ERRORS ==="
            grep -i -E "e: |error:|FAILURE|Unresolved|does not exist|not found|Execution failed|FAILED|Duplicate resources" build.log | head -n 600 || true
            echo ""
            echo "=== LAST 1000 LINES ==="
            tail -n 1000 build.log || true
          } > ci-error.log 2>&1
          
          # Truncated for issue (max 45k)
          head -c 45000 ci-error.log > ci-error-issue.log 2>&1 || cp ci-error.log ci-error-issue.log || echo "No log" > ci-error-issue.log
          echo "" >> ci-error-issue.log
          echo "--- truncated --- Run ${{ github.run_id }} ---" >> ci-error-issue.log
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed - Error Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Compilation errors:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i -E "e: |error:|FAILURE|Unresolved|does not exist|not found|Duplicate resources" build.log | head -n 300 >> $GITHUB_STEP_SUMMARY || echo "No pattern" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last 500 lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 500 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Build Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "APK files:" >> $GITHUB_STEP_SUMMARY
            find . -name "*.apk" -type f >> $GITHUB_STEP_SUMMARY || true
            ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY || true
          fi
          
          exit $EXIT_CODE

      - name: List APK outputs
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -n 20
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "--- ci-error.log head 600 ---"
          head -n 600 ci-error.log || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meelano-Legal-Luxury-APK-v2.1
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
            build.log
            ci-error.log
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v2.1
          path: |
            build.log
            ci-error.log
            app/build/reports/
          if-no-files-found: warn

      - name: Create Issue with error log via github-script
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('ci-error-issue.log', 'utf8');
              console.log('Read ci-error-issue.log', log.length);
            } catch (e) {
              console.log('Failed to read ci-error-issue.log:', e.message);
              try {
                const full = fs.readFileSync('build.log', 'utf8');
                log = full.slice(-45000);
                console.log('Read build.log tail', log.length);
              } catch (e2) {
                log = 'Failed to read logs: ' + e.message + ' ' + e2.message;
              }
            }
            if (log.length > 60000) log = log.slice(0, 60000) + '\n... truncated ...';
            
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build failed run ${{ github.run_id }} - ${{ github.sha }}`.slice(0, 200),
                body: log || 'No log available - check Actions summary',
              });
              console.log('Created issue', issue.data.number);
            } catch (e) {
              console.log('Failed to create issue:', e.message);
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Build failed ${{ github.run_id }}`,
                  body: `Run ${{ github.run_id }} failed. SHA ${{ github.sha }}. See Actions summary.\n\nError: ${e.message}\n\nLog snippet:\n\`\`\`\n${log.slice(0, 20000)}\n\`\`\``,
                });
              } catch (e2) {
                console.log('Second attempt failed:', e2.message);
              }
            }
