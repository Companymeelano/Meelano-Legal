name: Build Meelano Legal Luxury APK

on:
  push:
    branches: [ "arena/01a095aa-meelano-legal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create files
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo '{"project_info":{"project_number":"000","project_id":"meelano-legal-luxury","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000:android:000","android_client_info":{"package_name":"com.aistudio.meelanolegal.law"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore app/debug.keystore || true

      - name: Build Debug APK with log capture
        run: |
          set +e
          gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" | tee -a build.log
          echo "=== APK Search ===" | tee -a build.log
          find . -name "*.apk" -type f 2>/dev/null | tee -a build.log
          ls -R app/build/outputs/ 2>/dev/null | head -n 200 | tee -a build.log
          # Create dummy APK if build failed, to allow artifact upload for debugging
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "No APK found, creating info file" | tee -a build.log
            mkdir -p app/build/outputs/apk/debug/
            echo "Build failed, see build.log" > app/build/outputs/apk/debug/BUILD_FAILED.txt
          fi
          exit $EXIT_CODE

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meelano-Legal-Luxury-APK-v2.1
          path: |
            app/build/outputs/apk/debug/
            build.log
          if-no-files-found: warn

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v2.1
          path: |
            build.log
            app/build/reports/
          if-no-files-found: warn
