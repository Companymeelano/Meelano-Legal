name: Build Meelano Legal Luxury APK

on:
  push:
    branches: [ "arena/01a095aa-meelano-legal" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create files
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo '{"project_info":{"project_number":"000","project_id":"meelano-legal-luxury","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000:android:000","android_client_info":{"package_name":"com.aistudio.meelanolegal.law"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore app/debug.keystore || true

      - name: Build Debug APK with full error capture
        id: build
        run: |
          set -o pipefail
          echo "Starting build..."
          gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" | tee -a build.log
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          echo "=== APK Search ===" | tee -a build.log
          find . -name "*.apk" -type f 2>/dev/null | tee -a build.log || true
          ls -R app/build/outputs/ 2>/dev/null | head -n 300 | tee -a build.log || true
          
          # Create detailed error file
          echo "=== BUILD LOG SUMMARY ===" > ci-error.log
          echo "EXIT_CODE=$EXIT_CODE" >> ci-error.log
          echo "RUN_ID=${{ github.run_id }}" >> ci-error.log
          echo "SHA=${{ github.sha }}" >> ci-error.log
          echo "" >> ci-error.log
          echo "=== ERRORS ===" >> ci-error.log
          grep -i -E "e: |error:|FAILURE|Unresolved|does not exist|not found|Execution failed" build.log | head -n 400 >> ci-error.log || true
          echo "" >> ci-error.log
          echo "=== LAST 600 LINES ===" >> ci-error.log
          tail -n 600 build.log >> ci-error.log
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failed - Error Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Compilation errors:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i -E "e: |error:|FAILURE|Unresolved|does not exist|not found" build.log | head -n 200 >> $GITHUB_STEP_SUMMARY || echo "No pattern" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last 300 lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 300 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Build Succeeded" >> $GITHUB_STEP_SUMMARY
            find . -name "*.apk" -type f >> $GITHUB_STEP_SUMMARY
          fi
          
          exit $EXIT_CODE

      - name: List APK outputs
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -n 20
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "--- ci-error.log head 400 ---"
          head -n 400 ci-error.log || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meelano-Legal-Luxury-APK-v2.1
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
            build.log
            ci-error.log
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v2.1
          path: |
            build.log
            ci-error.log
            app/build/reports/
          if-no-files-found: warn

      - name: Create Gist with error log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating gist with error log..."
          # Truncate to 1MB max for gist (gist limit is smaller but we try)
          head -c 900000 ci-error.log > ci-error-gist.log || true
          
          # Use gh api to create gist
          gh api gists --method POST \
            -f description="Build error log run ${{ github.run_id }} sha ${{ github.sha }}" \
            -f public=false \
            -f files["ci-error-${{ github.run_id }}.log"].content="$(cat ci-error-gist.log | head -c 800000)" \
            || echo "Gist creation failed"
          
          # Also create issue without label
          gh issue create --title "Build failed ${{ github.run_id }}" --body-file ci-error-gist.log || echo "Issue creation failed, trying without body file"
          
          # Try simple issue
          gh issue create --title "Build failed ${{ github.run_id }} - log in gist" --body "Run ${{ github.run_id }} failed, see gist and artifacts. SHA ${{ github.sha }}. Check Actions summary for errors." || echo "Simple issue failed"
